name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Denetim ve testler
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://erp_app:erp_app@localhost:5432/erp_dev
      MIGRATION_DATABASE_URL: postgres://erp:erp@localhost:5432/erp_dev
      JWT_SECRET: ci-only-secret-ci-only-secret-32chars
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Roller ve veritabanları
        run: PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/postgres/init.sql

      - name: Lint
        run: npm run lint

      - name: Tip denetimi
        run: npm run typecheck

      - name: Birim ve entegrasyon testleri (gerçek PostgreSQL, RLS dahil)
        run: npm test

      - name: Geri yükleme tatbikatı (yedek al, taze veritabanına geri yükle, veri/yapı/RLS karşılaştır)
        run: |
          pg_dump --version
          bash scripts/restore-drill.sh

      - name: Lisans denetimi (yalnızca izinli lisanslar)
        run: npm run licenses

      - name: Bağımlılık güvenlik denetimi (üretim bağımlılıkları)
        run: npm audit --omit=dev --audit-level=high

      - name: Web ve API derlemesi (boş anahtar halkasıyla yalnızca derlenebilirlik doğrulanır; gerçek anahtarla derleme e2e ve docker işlerindedir)
        run: npm run build
        env:
          LICENSE_ALLOW_EMPTY_KEYRING: 'true'

      - name: Lisans sunucusu ve yönetim paneli derlemesi
        run: npm run build:license

  e2e:
    name: Uçtan uca testler
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://erp_app:erp_app@localhost:5432/erp_dev
      MIGRATION_DATABASE_URL: postgres://erp:erp@localhost:5432/erp_dev
      JWT_SECRET: ci-only-secret-ci-only-secret-32chars
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Roller ve veritabanları
        run: PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/postgres/init.sql

      - name: Veritabanı migration'ları
        run: npm run db:migrate

      - name: Gerçek lisans sunucusu (anahtar üret, migrate, başlat, lisans ver)
        run: scripts/ci-license-host.sh

      - name: Üretim paketi (web + API; satıcı açık anahtarı ve sunucu adresi pakete gömülür)
        run: npm run build

      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium

      - name: Uçtan uca testler (üretim paketine karşı)
        run: npm run e2e
        env:
          E2E_TARGET: bundle

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-sonuclari
          path: |
            test-results/
            ${{ runner.temp }}/license-ci/server.log
          if-no-files-found: ignore

  docker:
    name: Docker imajı ve compose duman testi
    runs-on: ubuntu-latest
    # Not: compose değişken önceliği kabuk ortamı > --env-file'dır; bu işe iş düzeyi JWT_SECRET/DATABASE_URL verilmez.
    steps:
      - uses: actions/checkout@v4

      - name: Lisans sunucusu (satıcı imajı ve compose'u; anahtar töreni, migrate, sunucu, iki lisans)
        run: scripts/ci-license-docker.sh

      - name: İmajı derle (satıcı açık anahtarı ve lisans sunucusu adresi pakete gömülür)
        run: |
          docker build -t muhasebe-erp:ci --build-arg APP_VERSION=ci \
            --build-arg LICENSE_PUBLIC_KEYS_JSON --build-arg LICENSE_SERVER_URL --build-arg LICENSE_ALLOW_INSECURE_URL .

      - name: İmaj root olmayan kullanıcıyla çalışır ve kaynak haritası içermez
        run: |
          test "$(docker run --rm --entrypoint id muhasebe-erp:ci -u)" != "0"
          test -z "$(docker run --rm --entrypoint find muhasebe-erp:ci /app/web /app/dist -name '*.map')"

      - name: Compose ortamı
        run: |
          cat > deploy/.env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          ERP_OWNER_PASSWORD=$(openssl rand -hex 16)
          ERP_APP_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          ERP_IMAGE=muhasebe-erp:ci
          COOKIE_SECURE=false
          APP_PORT=3000
          EOF

      - name: Compose'u ayağa kaldır (db, tek seferlik migrate, app)
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d app

      - name: Uygulama hazır olana dek bekle
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health/ready > /dev/null; then echo "hazır"; exit 0; fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs
          exit 1

      - name: Duman testi (arayüz, başlıklar, kayıt, giriş)
        run: |
          set -e
          curl -fsS -H 'accept: text/html' http://127.0.0.1:3000/ | grep -q '<div id="root">'
          curl -fsSI http://127.0.0.1:3000/ | grep -i "content-security-policy" | grep -q "script-src 'self'"
          curl -fsS http://127.0.0.1:3000/api/public-config | grep -q '"version":"ci"'
          # Lisanssız kurulum: iş uçları kapalı (402), etkinleştirme akışı açık
          curl -fsS http://127.0.0.1:3000/api/public-config | grep -q '"state":"unlicensed"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/me)" = "402"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/auth/register -H 'content-type: application/json' -d '{}')" = "402"
          curl -fsS -X POST http://127.0.0.1:3000/api/license/activate -H 'content-type: application/json' \
            -d "{\"code\":\"$LICENSE_CODE\"}" | grep -q '"state":"active"'
          curl -fsS http://127.0.0.1:3000/api/public-config | grep -q '"state":"active"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/me)" = "401"
          curl -fsS http://127.0.0.1:3000/THIRD-PARTY-NOTICES.md | grep -q 'Üçüncü taraf bildirimleri'
          docker run --rm --entrypoint test muhasebe-erp:ci -s /app/THIRD-PARTY-NOTICES.md
          curl -fsS -X POST http://127.0.0.1:3000/api/auth/register -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"Sifre-12345-xyz","fullName":"CI Kullanıcı","organizationName":"CI Ltd"}' | grep -q accessToken
          curl -fsS -X POST http://127.0.0.1:3000/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"Sifre-12345-xyz"}' | grep -q accessToken
          test "$(docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env ps -q app | xargs docker inspect --format '{{.State.Health.Status}}')" = "healthy" || (sleep 20; test "$(docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env ps -q app | xargs docker inspect --format '{{.State.Health.Status}}')" = "healthy")

      - name: Yedek → felaket kurtarma (compose kipi) → giriş
        run: |
          set -e
          DC="docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env"
          scripts/backup.sh --compose --dir "$RUNNER_TEMP/yedek"
          DUMP="$(ls "$RUNNER_TEMP"/yedek/erp-erp-*.dump)"
          # Boş olmayan hedefe geri yükleme reddedilir
          if scripts/restore.sh --compose "$DUMP"; then echo "dolu veritabanına geri yükleme reddedilmeliydi" >&2; exit 1; fi
          # Felaket kurtarma: uygulamayı durdur, veritabanını sil/yeniden yarat, geri yükle
          scripts/restore.sh --compose --recreate --yes "$DUMP"
          $DC up -d app
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS -X POST http://127.0.0.1:3000/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"Sifre-12345-xyz"}' | grep -q accessToken

      - name: Demo örneği (demo-seed, giriş, kayıt kapalı, sıfırlama)
        run: |
          set -e
          cat > deploy/.env.demo <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          ERP_OWNER_PASSWORD=$(openssl rand -hex 16)
          ERP_APP_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          ERP_IMAGE=muhasebe-erp:ci
          COOKIE_SECURE=false
          APP_PORT=3001
          EOF
          DEMO="docker compose -f deploy/docker-compose.demo.yml --env-file deploy/.env.demo"
          ready() { for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3001/api/health/ready > /dev/null; then return 0; fi; sleep 2; done; $DEMO logs --no-color; return 1; }
          login() { curl -fsS -X POST http://127.0.0.1:3001/api/auth/login -H 'content-type: application/json' -d '{"email":"demo@ornek.local","password":"Demo-Sifre-123"}' | grep -q accessToken; }
          $DEMO up -d app
          ready
          # Demo örneği de lisans ister (demo türü lisans)
          curl -fsS -X POST http://127.0.0.1:3001/api/license/activate -H 'content-type: application/json' \
            -d "{\"code\":\"$LICENSE_DEMO_CODE\"}" | grep -q '"state":"active"'
          login
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3001/api/auth/register -H 'content-type: application/json' -d '{"email":"x@example.com","password":"Sifre-12345-xyz","fullName":"X","organizationName":"X"}')" = "403"
          # Sıfırla ve yeniden giriş yap
          $DEMO stop app
          $DEMO run --rm demo-reset
          $DEMO up -d app
          ready
          # Sıfırlama lisans durumunu korur: yeniden etkinleştirme gerekmez
          curl -fsS http://127.0.0.1:3001/api/public-config | grep -q '"state":"active"'
          login

      - name: Günlükler (başarısızlıkta)
        if: failure()
        run: |
          if [ -f deploy/.env ]; then docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs --no-color; fi
          if [ -f deploy/.env.demo ]; then docker compose -f deploy/docker-compose.demo.yml --env-file deploy/.env.demo logs --no-color; fi
          if [ -f deploy/license/.env ]; then docker compose -f deploy/license/docker-compose.yml -f deploy/license/docker-compose.ci.yml --env-file deploy/license/.env logs --no-color; fi

      - name: Temizlik
        if: always()
        run: |
          if [ -f deploy/.env ]; then docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env down -v; fi
          if [ -f deploy/.env.demo ]; then docker compose -f deploy/docker-compose.demo.yml --env-file deploy/.env.demo down -v; fi
          if [ -f deploy/license/.env ]; then docker compose -f deploy/license/docker-compose.yml -f deploy/license/docker-compose.ci.yml --env-file deploy/license/.env down -v; fi
