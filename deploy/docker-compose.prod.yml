# Üretim kurulumu: db + tek seferlik migrate + app (+ isteğe bağlı Caddy ile otomatik HTTPS).
#   cp deploy/.env.production.example deploy/.env   # sonra değerleri doldurun
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
#   TLS ile:  ... --profile tls up -d
# Ayrıntı: docs/OPERATIONS.md
name: muhasebe-erp

# Kap günlükleri döndürülür (json-file): her kap en çok 5 × 10 MB; disk dolmasın
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    logging: *default-logging
    image: postgres:16 # Debian tabanlı: Türkçe sıralama için ICU (tr-TR-x-icu) gerekir
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      ERP_DB_NAME: ${ERP_DB_NAME:-erp}
      ERP_OWNER_PASSWORD: ${ERP_OWNER_PASSWORD:?ERP_OWNER_PASSWORD gerekli}
      ERP_APP_PASSWORD: ${ERP_APP_PASSWORD:?ERP_APP_PASSWORD gerekli}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init-prod.sh:/docker-entrypoint-initdb.d/10-init-prod.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U erp -d $${ERP_DB_NAME:-erp}']
      interval: 5s
      timeout: 5s
      retries: 20
    # Veritabanı portu YAYINLANMAZ; yalnızca uygulama kabı ağ içinden bağlanır.

  migrate:
    logging: *default-logging
    image: ${ERP_IMAGE:-muhasebe-erp:local}
    build:
      context: ..
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        # Yalnızca kaynaktan derleyen satıcı/CI için: müşteriler hazır imajı kullanır (docs/LICENSING.md)
        LICENSE_PUBLIC_KEYS_JSON: ${LICENSE_PUBLIC_KEYS_JSON:-}
        LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-}
        LICENSE_ALLOW_INSECURE_URL: ${LICENSE_ALLOW_INSECURE_URL:-}
    command: ['node', 'dist/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: postgres://erp:${ERP_OWNER_PASSWORD}@db:5432/${ERP_DB_NAME:-erp}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    logging: *default-logging
    image: ${ERP_IMAGE:-muhasebe-erp:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      # Uygulama kabı yalnızca RLS'e tabi çalışma zamanı rolünü bilir (sahip parolası yok)
      DATABASE_URL: postgres://erp_app:${ERP_APP_PASSWORD}@db:5432/${ERP_DB_NAME:-erp}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli (openssl rand -base64 48)}
      # Ters vekil (Caddy/nginx) arkasında loopback,uniquelocal (vekilin adresini kapsayan liste; sayı KABUL EDİLMEZ); vekil yoksa false
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      # Düz http (TLS'siz LAN) kurulumunda false verin; aksi halde tarayıcı yenileme çerezini atar
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # E-posta (parola sıfırlama, doğrulama): SMTP_URL verilirse açılır; APP_BASE_URL e-postalardaki bağlantı köküdür
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-90}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-60000}
      # Lisans sunucusu (satıcı); imajda varsayılan adres gömülüyse boş bırakılabilir. Çıkış HTTPS (443) izni gerekir.
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-}
      LICENSE_ALLOW_INSECURE_URL: ${LICENSE_ALLOW_INSECURE_URL:-false}
      # Uzaktan güncelleme (kurulum sihirbazı yazar): ana makinedeki güncelleyiciyle paylaşılan belirteç ve kit hedefi
      ERP_UPDATER_TOKEN: ${ERP_UPDATER_TOKEN:-}
      ERP_KIT_TARGET: ${ERP_KIT_TARGET:-}
    extra_hosts:
      # Ana makinedeki hizmetlere (örn. yerel lisans sunucusu, SMTP geçidi) host.docker.internal adıyla erişim
      - 'host.docker.internal:host-gateway'
    volumes:
      # Lisans parmak izi: ana makinenin kimliği (yalnızca okuma). Dosya yoksa compose başlamayı reddeder (ana makinede oluşturun:
      # systemd-machine-id-setup). Bu kimlik olmadan lisans yalnızca veritabanı kümesine bağlanır (klon koruması zayıf).
      - type: bind
        # Windows (Docker Desktop): kurulum sihirbazı makine kimliğini bir dosyaya yazar ve ERP_HOST_ID_FILE ile verir
        source: ${ERP_HOST_ID_FILE:-/etc/machine-id}
        target: /etc/host-machine-id
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Varsayılan yalnızca yerel makine; TLS'siz LAN erişimi için APP_BIND=0.0.0.0
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'

  caddy:
    logging: *default-logging
    profiles: ['tls']
    image: caddy:2
    restart: unless-stopped
    environment:
      # Yalnızca 'tls' profilinde kullanılır; profil kapalıyken boş olması sorun değildir (compose tüm servisleri yorumlar)
      ERP_DOMAIN: ${ERP_DOMAIN:-}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # Kurulum sihirbazı HTTPS ayarına göre deploy/Caddyfile.local üretir ve ERP_CADDYFILE ile gösterir
      - ${ERP_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${ERP_CERT_DIR:-./certs}:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
