# Lisans sunucusu (SATICI VPS'i): db + tek seferlik migrate + lisans sunucusu + Caddy (otomatik HTTPS).
#   cp deploy/license/.env.example deploy/license/.env      # değerleri doldurun
#   İmza anahtarını üretin (bir kez, kayıt altına alın):  docs/LICENSING.md "Anahtar töreni"
#   docker compose -f deploy/license/docker-compose.yml --env-file deploy/license/.env up -d --build
# Ayrıntı: docs/LICENSING.md
name: muhasebe-lisans

# Kap günlükleri döndürülür (json-file): her kap en çok 5 × 10 MB; disk dolmasın
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    logging: *default-logging
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      ERP_DB_NAME: erp_license
      ERP_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD gerekli}
      ERP_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD gerekli}
    volumes:
      - licensedata:/var/lib/postgresql/data
      - ../../infra/postgres/init-prod.sh:/docker-entrypoint-initdb.d/10-init-prod.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U erp -d erp_license']
      interval: 5s
      timeout: 5s
      retries: 20
    # Veritabanı portu YAYINLANMAZ.

  migrate:
    logging: *default-logging
    image: ${LICENSE_IMAGE:-muhasebe-lisans:local}
    build:
      context: ../..
      dockerfile: apps/license-server/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    command: ['node', 'dist/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: postgres://erp:${DB_OWNER_PASSWORD}@db:5432/erp_license
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  license:
    logging: *default-logging
    image: ${LICENSE_IMAGE:-muhasebe-lisans:local}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      DATABASE_URL: postgres://erp_app:${DB_APP_PASSWORD}@db:5432/erp_license
      LICENSE_DATA_KEY: ${LICENSE_DATA_KEY:?LICENSE_DATA_KEY gerekli (openssl rand -base64 48)}
      LICENSE_SIGNING_KEY_FILE: /run/keys/signing-key.json
      LICENSE_SIGNING_KEY_PASSPHRASE: ${LICENSE_SIGNING_KEY_PASSPHRASE:?LICENSE_SIGNING_KEY_PASSPHRASE gerekli}
      # Fastify ≥ 5.12 sayısal atlama değerini ("1") yok sayar; yalnızca iç ağdaki vekile (Caddy) güvenilir.
      TRUST_PROXY: 'loopback,uniquelocal'
      ADMIN_COOKIE_SECURE: 'true'
      # Giriş anahtarları (passkey) bu kökene bağlanır; alan adı değişirse eski anahtarlar çalışmaz.
      LICENSE_ADMIN_ORIGIN: https://${LICENSE_DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Mühürlü imza anahtarı dosyası (ana makinede yalnızca root okuyabilmeli): <LICENSE_KEY_DIR>/signing-key.json
      - ${LICENSE_KEY_DIR:?LICENSE_KEY_DIR gerekli}:/run/keys:ro
      # Uzaktan güncelleme kit arşivleri (panelden yüklenir; yedeklenmesi gerekmez, npm run release ile yeniden üretilebilir)
      - releases:/var/lib/erp-license/releases
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Yayınlanan port yok: yalnızca Caddy ağ içinden bağlanır.

  caddy:
    logging: *default-logging
    image: caddy:2
    restart: unless-stopped
    environment:
      LICENSE_DOMAIN: ${LICENSE_DOMAIN:?LICENSE_DOMAIN gerekli}
      LICENSE_ADMIN_ALLOW: ${LICENSE_ADMIN_ALLOW:-0.0.0.0/0 ::/0}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - license

volumes:
  licensedata:
  releases:
  caddy_data:
  caddy_config:
