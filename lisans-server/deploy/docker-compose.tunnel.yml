# Cloudflare Tunnel varyantı: 80/443 YAYINLANMAZ, TLS Cloudflare kenarında biter; cloudflared ağ içinden Caddy'ye bağlanır.
#   docker compose -f lisans-server/deploy/docker-compose.yml -f lisans-server/deploy/docker-compose.tunnel.yml \
#     --env-file lisans-server/deploy/.env up -d --build
# Gerekenler (.env): LICENSE_DOMAIN, CLOUDFLARED_DIR (içinde config.yml + <tünel-id>.json; 65532 okuyabilmeli).
# Alan adının DNS kaydı tünele CNAME'dir (cloudflared tunnel route dns <tünel> <alan adı>).
# Ayrıntı: lisans-server/docs/LICENSING.md
# Kap günlükleri döndürülür (json-file): her kap en çok 5 × 10 MB; disk dolmasın
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  license:
    logging: *default-logging
    environment:
      # Caddy X-Forwarded-For'u Cf-Connecting-IP'den gelen tek istemci adresiyle yazar; license yalnızca iç ağdaki Caddy'ye güvenir.
      TRUST_PROXY: 'loopback,uniquelocal'

  caddy:
    logging: *default-logging
    ports: !reset []
    volumes: !override
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  cloudflared:
    logging: *default-logging
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', '--config', '/etc/cloudflared/config.yml', 'run']
    volumes:
      - ${CLOUDFLARED_DIR:?CLOUDFLARED_DIR gerekli}:/etc/cloudflared:ro
    depends_on:
      - caddy
